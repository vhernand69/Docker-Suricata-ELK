input {
  beats {
    port => 5044
  }

  tcp {
    port => 50000
    codec => line
  }
}

filter {
  mutate {
    add_field => { "source" => "tcp_input" }
  }
}

output {
  elasticsearch {
    hosts => "http://elasticsearch:9200"
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    index => "tcp-logs-%{+YYYY.MM.dd}"
  }
}
